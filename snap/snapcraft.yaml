name: swiftcut
adopt-info: swiftcut
confinement: strict
base: core24

apps:
  swiftcut:
    extensions: [gnome]
    command: bin/swiftcut
    common-id: org.ilab.SwiftCut
    desktop: share/applications/org.ilab.SwiftCut.desktop
    plugs:
      - home
      - gsettings
      - network
      - network-bind
      - removable-media
      - x11
      - wayland
      - opengl
      - shared-memory
      - serial-port
    environment:
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
      PYTHONPATH: $SNAP/lib/python3.12/site-packages:$SNAP/usr/lib/python3/dist-packages
      LD_LIBRARY_PATH: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/libproxy:$SNAP/usr/lib/swiftcut-libs
      LD_PRELOAD: $SNAP/bin/semwraplib.so
      XDG_DATA_DIRS: $SNAP/usr/share:$SNAP/gnome-platform/usr/share:$XDG_DATA_DIRS

plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404

slots:
  swiftcut:
    interface: dbus
    bus: session
    name: org.ilab.SwiftCut

parts:
  semwraplib:
    plugin: dump
    source: snap
    override-build: |
      mkdir -p ../install/bin
      gcc -g -O0 -Wall -Wstrict-prototypes -fPIC -shared semwraplib.c -o ../install/bin/semwraplib.so -ldl
    build-packages:
      - build-essential

  swiftcut:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    build-packages:
      - python3-pip
      - python3-setuptools
      - libvips-dev
      - git # Required for git describe
      - gtk-update-icon-cache
    stage-packages:
      - libvips42t64
      - adwaita-icon-theme
      - hicolor-icon-theme
    organize:
      data/org.ilab.SwiftCut.desktop: share/applications/org.ilab.SwiftCut.desktop
      data/org.ilab.SwiftCut.metainfo.xml: share/metainfo/org.ilab.SwiftCut.metainfo.xml
      data/org.ilab.SwiftCut.xml: share/mime/packages/org.ilab.SwiftCut.xml
    parse-info: [share/metainfo/org.ilab.SwiftCut.metainfo.xml]
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags)"
    override-build: |
      # Create a single, generic directory for all our custom-staged libs
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs

      # Symlink ALL required libraries into our new generic directory
      ln -s ../x86_64-linux-gnu/libvips.so.42 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libvips.so.42
      ln -s ../x86_64-linux-gnu/libfftw3.so.3 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libfftw3.so.3
      ln -s ../x86_64-linux-gnu/libcfitsio.so.10 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libcfitsio.so.10
      ln -s ../x86_64-linux-gnu/libimagequant.so.0 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libimagequant.so.0
      ln -s ../x86_64-linux-gnu/libcgif.so.0 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libcgif.so.0
      ln -s ../x86_64-linux-gnu/libexif.so.12 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libexif.so.12
      ln -s ../x86_64-linux-gnu/libspng.so.0 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libspng.so.0
      ln -s ../x86_64-linux-gnu/libmatio.so.11 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libmatio.so.11
      ln -s ../x86_64-linux-gnu/libOpenEXR-3_1.so.30 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libOpenEXR-3_1.so.30
      ln -s ../x86_64-linux-gnu/libhwy.so.1 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libhwy.so.1
      ln -s ../x86_64-linux-gnu/libhdf5_serial.so.103 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libhdf5_serial.so.103
      ln -s ../x86_64-linux-gnu/libImath-3_1.so.29 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libImath-3_1.so.29
      ln -s ../x86_64-linux-gnu/libIlmThread-3_1.so.30 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libIlmThread-3_1.so.30
      ln -s ../x86_64-linux-gnu/libIex-3_1.so.30 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libIex-3_1.so.30
      ln -s ../x86_64-linux-gnu/libsz.so.2 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libsz.so.2
      ln -s ../x86_64-linux-gnu/libaec.so.0 $SNAPCRAFT_PART_INSTALL/usr/lib/swiftcut-libs/libaec.so.0

      gtk-update-icon-cache -q -t -f $SNAPCRAFT_PART_INSTALL/usr/share/icons/Adwaita
      $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache

      craftctl default
