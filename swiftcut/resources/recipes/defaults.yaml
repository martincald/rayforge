# SwiftCut bundled material recipes.
# Built-in recipes are read-only in the app; bump `version` whenever
# values change so updated apps replace the built-in set.
# Versions 1 and 2 were placeholder sets; this list is version 3.
version: 3

operations:
  cut:     { step: contour, description: "Vector cut through the material" }
  scan:    { step: contour, description: "Line scan: outline at low power" }
  engrave: { step: raster,  description: "Raster fill engrave; adjust manually for depth or color" }

recipes:
  # ---------------- MDF ----------------
  - id: mdf-6-cut
    name: "MDF 6 mm · Cut"
    material: MDF
    thickness_mm: 6
    operation: cut
    color: "#8B5A2B"
    machines:
      ilab-614: { speed_mm_s: 20,   power_pct: 65 }
      ilab-626: { speed_mm_s: 12.5, power_pct: 75 }

  - id: mdf-3-cut
    name: "MDF 3 mm · Cut"
    material: MDF
    thickness_mm: 3
    operation: cut
    color: "#A0693A"
    machines:
      ilab-614: { speed_mm_s: 30, power_pct: 50 }
      ilab-626: { speed_mm_s: 35, power_pct: 65 }

  - id: mdf-scan
    name: "MDF · Scan"
    material: MDF
    thickness_mm: null
    operation: scan
    color: "#C8A27A"
    machines:
      ilab-614: { speed_mm_s: 500, power_pct: 18 }
      ilab-626: { speed_mm_s: 500, power_pct: 18 }

  - id: mdf-engrave
    name: "MDF · Engrave (base)"
    material: MDF
    thickness_mm: null
    operation: engrave
    color: "#D9B892"
    notes: "Base setting. For deeper or darker engraving the user adjusts power/speed."
    machines:
      ilab-614: { speed_mm_s: 200, power_pct: 10 }
      ilab-626: { speed_mm_s: 200, power_pct: 10 }

  # ---------------- Acrylic ----------------
  - id: acrylic-6-cut
    name: "Acrylic 6 mm · Cut"
    material: Acrylic
    thickness_mm: 6
    operation: cut
    color: "#1E6FD9"
    machines:
      ilab-614: { speed_mm_s: 20, power_pct: 70 }
      ilab-626: { speed_mm_s: 20, power_pct: 70 }

  - id: acrylic-3-cut
    name: "Acrylic 3 mm · Cut"
    material: Acrylic
    thickness_mm: 3
    operation: cut
    color: "#3A8BE8"
    machines:
      ilab-614: { speed_mm_s: 30, power_pct: 55 }
      ilab-626: { speed_mm_s: 30, power_pct: 55 }

  - id: acrylic-scan
    name: "Acrylic · Scan"
    material: Acrylic
    thickness_mm: null
    operation: scan
    color: "#7FB6F2"
    machines:
      ilab-614: { speed_mm_s: 500, power_pct: 10 }
      ilab-626: { speed_mm_s: 500, power_pct: 10 }

  - id: acrylic-3-engrave
    name: "Acrylic 3 mm · Engrave (base)"
    material: Acrylic
    thickness_mm: 3
    operation: engrave
    color: "#A9CDF6"
    notes: "Base setting; adjust manually for depth."
    machines:
      ilab-614: { speed_mm_s: 300, power_pct: 10 }
      ilab-626: { speed_mm_s: 300, power_pct: 10 }

  # ---------------- Foamboard ----------------
  - id: foamboard-3-cut
    name: "Foamboard 3 mm · Cut"
    material: Foamboard
    thickness_mm: 3
    operation: cut
    color: "#2E9E5B"
    machines:
      ilab-614: { speed_mm_s: 15, power_pct: 10 }
      ilab-626: { speed_mm_s: 15, power_pct: 10 }

  - id: foamboard-3-cut-one-side
    name: "Foamboard 3 mm · Cut one side only"
    material: Foamboard
    thickness_mm: 3
    operation: cut
    color: "#4FB87A"
    notes: "Scores the top paper layer only."
    machines:
      ilab-614: { speed_mm_s: 30, power_pct: 8 }
      ilab-626: { speed_mm_s: 30, power_pct: 8 }

  - id: foamboard-3-scan
    name: "Foamboard 3 mm · Scan"
    material: Foamboard
    thickness_mm: 3
    operation: scan
    color: "#8ED3A9"
    machines:
      ilab-614: { speed_mm_s: 220, power_pct: 8 }
      ilab-626: { speed_mm_s: 220, power_pct: 8 }
