# Built-in recipes shipped with SwiftCut.
#
# PLACEHOLDER: the recipes below are examples, not tested settings. The
# owner will replace them with the real defaults.
#
# On startup the app syncs these into the user's recipe directory when
# `version` is higher than the version recorded there. Bump `version`
# whenever this list changes. Built-ins are replaced by this set; user
# recipes are untouched; a built-in the user edited is kept as a copy.
#
# Each recipe needs a fixed `uid`. Units are the model's: speeds in
# mm/min, power 0..1. `target_step_types` are step class names. Every
# placeholder is tied to a material and thickness so it is only picked
# for matching stock.
version: 1
recipes:
- uid: fcc9c750-5441-497c-ab74-c9d6702645b8
  name: Plywood 3 mm Cut
  description: Placeholder, not tested.
  color: '#ff6600'
  target_step_types: [ContourStep]
  material_uid: plywood
  min_thickness_mm: 3.0
  max_thickness_mm: 3.0
  settings:
    power: 0.65
    cut_speed: 1200
- uid: dd26a12f-28d4-4591-a00a-281ad7d650e5
  name: Plywood 3 mm Engrave
  description: Placeholder, not tested.
  color: '#00ccff'
  target_step_types: [EngraveStep]
  material_uid: plywood
  min_thickness_mm: 3.0
  max_thickness_mm: 3.0
  settings:
    power: 0.2
    cut_speed: 18000
- uid: fa1c565c-b875-471c-bdb6-1800d14b5f2a
  name: Acrylic 3 mm Cut
  description: Placeholder, not tested.
  color: '#cc3366'
  target_step_types: [ContourStep]
  material_uid: acrylic
  min_thickness_mm: 3.0
  max_thickness_mm: 3.0
  settings:
    power: 0.7
    cut_speed: 600
